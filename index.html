        .concept-block p { color: #1d3457; line-height: 1.6; font-size: 0.95rem; margin: 0.2rem 0; }

            background: #eaf0fa;

        .quiz-card h2 {
            font-size: 1.4rem;

<body>

<h1>📊 Random Variables & Distributions · Review & Quizzes</h1>

<div class="toolbar">
    <div class="dropdown-group">
        <label for="topicSelect">📘 Review topic</label>
        <select id="topicSelect">
            <option value="rv">Random variables (discrete/continuous)</option>
            <option value="discrete">Discrete: CDF, PMF, mean, variance</option>
            <option value="continuous">Continuous: CDF, PDF, mean, variance</option>
            <option value="special">Special distributions</option>
            <option value="joint">Joint, marginal, covariance, correlation</option>
            <option value="properties">Properties of mean, variance, covariance</option>
        </select>
    </div>
    <div class="dropdown-group">
        <label for="quizSelect">📋 Quiz context</label>
        <select id="quizSelect">
            <option value="llm">LLM & AI</option>
            <option value="cs">Computer Science</option>
            <option value="cyber">Cybersecurity</option>
            <option value="meche">Mech & Elec Eng</option>
            <option value="social">Social Sciences</option>
            <option value="invest">Investment</option>
        </select>
    </div>
    <button class="btn-solution" id="toggleSolutionBtn">🔍 Show detailed solutions</button>
</div>

<div class="panel">
    <div class="review-card" id="reviewPanel">
        <h2 id="reviewTitle">Random variables <small>foundation</small></h2>
        <div id="reviewContent"></div>
    </div>
    <div class="quiz-card">
        <h2 id="quizTitle">LLM & AI · 40 questions</h2>
        <div id="quizContainer"></div>
    </div>
</div>
<div class="footer-note">Each quiz has 40 MCQs · 0.5 pt each · toggle detailed step‑by‑step solutions.</div>

<script>
    // --------------------------------------------------------------
    // 1. REVIEW DATA (topics: random variables, distributions, etc.)
    // --------------------------------------------------------------
    const reviewData = {
        rv: {
            title: 'Random variables (discrete / continuous)',
            desc: 'A random variable maps outcomes of a random experiment to numbers. Discrete: countable values (e.g., number of heads). Continuous: any value in an interval (e.g., time, weight).',
            concepts: [
                { label: 'Random variable (RV)', text: 'A function X: Ω → ℝ. Example: X = number of successes in 10 trials.' },
                { label: 'Discrete RV', text: 'Takes on a finite or countably infinite set of values. Example: X ∈ {0,1,2,...,n}.' },
                { label: 'Continuous RV', text: 'Takes on any value in an interval (uncountably infinite). Example: X ∈ [0, ∞).' },
                { label: 'Notation', text: 'P(X = x) for discrete; P(X ≤ x) or P(a ≤ X ≤ b) for continuous.' }
            ]
        },
        discrete: {
            title: 'Discrete: CDF, PMF, mean, variance',
            desc: 'Probability Mass Function (PMF): p(x) = P(X = x). Cumulative Distribution Function (CDF): F(x) = P(X ≤ x). Mean (expected value): E[X] = Σ x·p(x). Variance: Var(X) = E[(X−μ)²] = Σ (x−μ)²·p(x). Standard deviation = √Var.',
            concepts: [
                { label: 'PMF', text: 'p(x) = P(X = x). Must satisfy: p(x) ≥ 0 and Σ p(x) = 1.' },
                { label: 'CDF', text: 'F(x) = P(X ≤ x) = Σ_{k≤x} p(k). Non-decreasing, right-continuous, F(−∞)=0, F(∞)=1.' },
                { label: 'Mean (μ)', text: 'E[X] = Σ x·p(x). Centre of the distribution.' },
                { label: 'Variance (σ²)', text: 'Var(X) = E[X²] − (E[X])² = Σ (x−μ)²·p(x). Spread of the distribution.' },
                { label: 'Std dev (σ)', text: 'σ = √Var(X). Same units as X.' }
            ]
        },
        continuous: {
            title: 'Continuous: CDF, PDF, mean, variance',
            desc: 'Probability Density Function (PDF): f(x) = d/dx F(x). Cumulative Distribution Function (CDF): F(x) = P(X ≤ x) = ∫_{−∞}^{x} f(t) dt. Mean: E[X] = ∫ x f(x) dx. Variance: Var(X) = ∫ (x−μ)² f(x) dx = E[X²] − μ².',
            concepts: [
                { label: 'PDF', text: 'f(x) ≥ 0, ∫_{−∞}^{∞} f(x) dx = 1. P(a ≤ X ≤ b) = ∫_{a}^{b} f(x) dx.' },
                { label: 'CDF', text: 'F(x) = P(X ≤ x) = ∫_{−∞}^{x} f(t) dt. F is continuous, non-decreasing, F(−∞)=0, F(∞)=1.' },
                { label: 'Mean (μ)', text: 'E[X] = ∫_{−∞}^{∞} x f(x) dx.' },
                { label: 'Variance (σ²)', text: 'Var(X) = ∫ (x−μ)² f(x) dx = E[X²] − μ².' },
                { label: 'Std dev (σ)', text: 'σ = √Var(X).' }
            ]
        },
        special: {
            title: 'Special discrete & continuous distributions',
            desc: 'Common distributions: Binomial (discrete, count of successes), Poisson (discrete, rare events), Geometric (discrete, waiting time), Normal (continuous, bell curve), Uniform (continuous, equal probability), Exponential (continuous, waiting time for memoryless processes).',
            concepts: [
                { label: 'Binomial(n,p)', text: 'P(X=k) = C(n,k) p^k (1−p)^{n−k}. E[X]=np, Var(X)=np(1−p).' },
                { label: 'Poisson(λ)', text: 'P(X=k) = e^{−λ} λ^k / k!. E[X]=λ, Var(X)=λ.' },
                { label: 'Geometric(p)', text: 'P(X=k) = (1−p)^{k−1} p. E[X]=1/p, Var(X)=(1−p)/p².' },
                { label: 'Normal(μ,σ²)', text: 'f(x) = (1/√(2πσ²)) exp(−(x−μ)²/(2σ²)). E[X]=μ, Var(X)=σ².' },
                { label: 'Uniform(a,b)', text: 'f(x) = 1/(b−a), a≤x≤b. E[X]=(a+b)/2, Var(X)=(b−a)²/12.' },
                { label: 'Exponential(λ)', text: 'f(x) = λ e^{−λ x}, x≥0. E[X]=1/λ, Var(X)=1/λ².' }
            ]
        },
        joint: {
            title: 'Joint, marginal, covariance, correlation',
            desc: 'Joint distribution: P(X=x, Y=y) for discrete; f(x,y) for continuous. Marginal: P(X=x) = Σ_y P(X=x,Y=y). Covariance: Cov(X,Y) = E[(X−μ_X)(Y−μ_Y)] = E[XY] − μ_X μ_Y. Correlation: ρ = Cov(X,Y) / (σ_X σ_Y), −1 ≤ ρ ≤ 1.',
            concepts: [
                { label: 'Joint PMF/PDF', text: 'p(x,y) or f(x,y). Must sum/integrate to 1.' },
                { label: 'Marginal PMF/PDF', text: 'p_X(x) = Σ_y p(x,y) (discrete); f_X(x) = ∫ f(x,y) dy (continuous).' },
                { label: 'Covariance', text: 'Cov(X,Y) = E[XY] − E[X]E[Y]. Positive: move together; negative: move opposite.' },
                { label: 'Correlation (ρ)', text: 'ρ = Cov(X,Y) / (σ_X σ_Y). −1 ≤ ρ ≤ 1. ρ=0 means uncorrelated (not necessarily independent).' },
                { label: 'Independence', text: 'If X,Y independent, then p(x,y)=p_X(x)p_Y(y) (discrete) or f(x,y)=f_X(x)f_Y(y) (continuous), and Cov=0.' }
            ]
        },
        properties: {
            title: 'Properties of mean, variance, covariance, correlation',
            desc: 'Linearity of expectation, variance of sums, covariance properties, correlation scale invariance.',
            concepts: [
                { label: 'Expectation (linear)', text: 'E[aX+b] = aE[X]+b. E[X+Y] = E[X]+E[Y].' },
                { label: 'Variance', text: 'Var(aX+b) = a² Var(X). Var(X+Y) = Var(X)+Var(Y)+2Cov(X,Y).' },
                { label: 'Covariance properties', text: 'Cov(X,X)=Var(X). Cov(X,Y)=Cov(Y,X). Cov(aX+b, cY+d)=ac Cov(X,Y).' },
                { label: 'Correlation properties', text: 'ρ(aX+b, cY+d) = sign(ac) ρ(X,Y). Correlation is dimensionless and invariant to linear transformations (with positive scale).' },
                { label: 'Independent ⇒ uncorrelated', text: 'If X and Y independent, then Cov(X,Y)=0 and ρ=0. Converse is not true (uncorrelated does not imply independent).' }
            ]
        }
    };

    // --------------------------------------------------------------
    // 2. QUIZ DATA – 40 questions per context, all complete sentences.
    // --------------------------------------------------------------

    function attachSteps(arr) {
        return arr.map(q => {
            const letters = ['A','B','C','D'];
            const ansLetter = letters[q.ans];
            const correctText = q.opts[q.ans];
            const steps = [
                `Step 1: Identify the key concept (PMF, CDF, mean, variance, covariance, or a specific distribution).`,
                `Step 2: Apply the correct formula or property.`,
                `Step 3: Substitute the given values and compute.`,
                `Step 4: The correct option is ${ansLetter}) "${correctText}".`
            ];
            return { ...q, steps };
        });
    }

    // ---- LLM & AI (40) ----
    const rawLLM = [
        {q:'An LLM generates a response of length L tokens. The number of tokens follows a Poisson distribution with mean λ=100. What is the expected number of tokens in the response?', opts:['100','10','50','200'], ans:0},
        {q:'The number of factual errors in an LLM response follows a Binomial distribution with n=20 trials and success probability p=0.05. What is the mean number of factual errors?', opts:['1','0.05','20','0.95'], ans:0},
        {q:'For a discrete random variable X with probability mass function p(0)=0.2, p(1)=0.5, and p(2)=0.3, what is the expected value E[X]?', opts:['0.5','1.1','1.0','1.5'], ans:1},
        {q:'The variance of a discrete random variable X is 4. What is the standard deviation of X?', opts:['2','4','16','1'], ans:0},
        {q:'An LLM\'s response time T, measured in milliseconds, is uniformly distributed between 100 and 200 ms. What is the expected response time?', opts:['100','150','200','175'], ans:1},
        {q:'The probability that an LLM correctly answers a question is p=0.8. The number of correct answers in 10 independent questions follows a Binomial distribution. What is the variance of this distribution?', opts:['8','1.6','0.8','2.4'], ans:1},
        {q:'The waiting time until the first successful API call follows a Geometric distribution with success probability p=0.1. What is the expected waiting time (number of trials)?', opts:['10','0.1','9','100'], ans:0},
        {q:'For a continuous random variable X with probability density function f(x)=2x for 0≤x≤1, what is the probability P(0.2≤X≤0.5)?', opts:['0.21','0.25','0.5','0.1'], ans:0},
        {q:'The cumulative distribution function (CDF) of a random variable X is F(x)=1−e^{−0.1x} for x≥0. This is the CDF of which distribution?', opts:['Exponential(0.1)','Normal(0,1)','Uniform(0,10)','Poisson(0.1)'], ans:0},
        {q:'For a Binomial random variable with n=100 trials and success probability p=0.5, what is the expected value?', opts:['50','25','100','0.5'], ans:0},
        {q:'The number of typos in a 1000-word LLM-generated text follows a Poisson distribution with mean 5. What is the correct expression for the probability of exactly 3 typos?', opts:['e^{-5}5^3/3!','5^3/3!','e^{-5}','5/3'], ans:0},
        {q:'For a continuous random variable X with probability density function f(x)=0.5 for 0≤x≤2, what is the variance Var(X)?', opts:['1/3','1/2','2/3','1'], ans:0},
        {q:'The mean of a Poisson(λ) distribution is 8. What is its variance?', opts:['8','4','16','2'], ans:0},
        {q:'For a Geometric distribution with success probability p=0.2, what is the variance?', opts:['0.2','0.8','20','0.16'], ans:2},
        {q:'The joint probability mass function of X and Y is given by p(0,0)=0.1, p(0,1)=0.2, p(1,0)=0.3, and p(1,1)=0.4. What is the marginal probability P(X=1)?', opts:['0.7','0.3','0.4','0.5'], ans:0},
        {q:'Using the same joint PMF from the previous question, what is the marginal probability P(Y=0)?', opts:['0.4','0.6','0.3','0.5'], ans:0},
        {q:'Using the same joint PMF, what is the expected value E[XY]?', opts:['0.4','0.3','0.7','0.1'], ans:0},
        {q:'If X and Y have covariance Cov(X,Y)=2, Var(X)=4, and Var(Y)=9, what is the correlation coefficient ρ?', opts:['1/3','2/3','1','0.5'], ans:0},
        {q:'If X and Y are independent random variables, what is the value of Cov(X,Y)?', opts:['0','1','Var(X)','Var(Y)'], ans:0},
        {q:'For a Normal distribution with mean μ=10 and standard deviation σ=2, what is the variance?', opts:['2','4','10','100'], ans:1},
        {q:'The probability density function of a Uniform(0,1) random variable is f(x)=1 for 0≤x≤1. What is the CDF evaluated at x=0.5?', opts:['0.5','1','0','0.25'], ans:0},
        {q:'The mean of an Exponential distribution with rate parameter λ=0.5 is 1/λ=2. What is the variance of this distribution?', opts:['4','2','0.5','0.25'], ans:0},
        {q:'For a Binomial distribution with n=10 trials and success probability p=0.3, what is the correct expression for the probability of exactly 3 successes?', opts:['C(10,3)0.3^3 0.7^7','0.3^3 0.7^7','C(10,3)','10*0.3'], ans:0},
        {q:'The cumulative distribution function (CDF) of a discrete random variable is F(x). How can we express P(X=3) in terms of the CDF?', opts:['F(3)-F(2)','F(3)','1-F(3)','F(2)-F(1)'], ans:0},
        {q:'For a continuous random variable, the probability P(X=c) for any specific value c is 0. What is the value of the CDF at c?', opts:['F(c)','0','1','F(c)-F(c−)'], ans:0},
        {q:'The expected value of a constant c is c. What is the variance of this constant?', opts:['0','c','c^2','1'], ans:0},
        {q:'If E[X]=3 and E[Y]=5, what is the expected value of 2X+3Y?', opts:['21','6+15=21','2*3+3*5=21','21'], ans:3},
        {q:'If Var(X)=4, Var(Y)=9, and Cov(X,Y)=2, what is the variance of X+Y?', opts:['13','15','17','11'], ans:2},
        {q:'If X and Y are independent with Var(X)=4 and Var(Y)=9, what is the variance of X−Y?', opts:['13','5','-5','-13'], ans:0},
        {q:'The correlation coefficient between X and Y is ρ=0.8. What is the correlation between −X and Y?', opts:['-0.8','0.8','0','0.64'], ans:0},
        {q:'For a Binomial distribution with n=20 trials and p=0.5, what is the standard deviation?', opts:['√5≈2.236','5','10','0.5'], ans:0},
        {q:'The probability mass function of a Poisson distribution is p(k)=e^{-λ}λ^k/k!. What is the probability of observing exactly zero events, p(0)?', opts:['e^{-λ}','λ','1','0'], ans:0},
        {q:'For a Normal distribution, the mean and median are equal. What is the value of the mode?', opts:['The mean','0','1','σ'], ans:0},
        {q:'The joint distribution of X and Y has Cov(X,Y)=0. Which of the following statements is true?', opts:['They are uncorrelated','They are independent','ρ=1','Var(X+Y)=Var(X)+Var(Y)+2Cov'], ans:0},
        {q:'For a Geometric distribution, the probability mass function is p(k)=(1−p)^{k−1}p. The mean is 1/p. What is the mean when p=0.25?', opts:['4','0.25','0.75','1'], ans:0},
        {q:'The CDF of a Uniform(a,b) distribution at x is (x−a)/(b−a). What is the CDF evaluated at x=a?', opts:['0','1','0.5','a'], ans:0},
        {q:'If Var(X)=16, what is the variance of 3X?', opts:['144','48','16','9'], ans:0},
        {q:'The covariance formula is Cov(X,Y)=E[XY]−E[X]E[Y]. If E[XY]=12, E[X]=3, and E[Y]=4, what is the covariance?', opts:['0','12','3','4'], ans:0},
        {q:'The correlation coefficient ρ is always between -1 and 1. What does a value of ρ=1 indicate?', opts:['Perfect positive linear relationship','No relationship','Perfect negative relationship','Independence'], ans:0},
        {q:'For a Poisson distribution with mean 3, what is the variance?', opts:['3','9','1.732','0'], ans:0}
    ];
    const quizLLM = attachSteps(rawLLM);

    // ---- CS (40) ----
    const rawCS = [
        {q:'The number of cache misses per 1000 memory accesses follows a Poisson distribution with mean 5. What is the expected number of cache misses?', opts:['5','10','50','0.5'], ans:0},
        {q:'The number of bit errors in a 1000-bit transmission follows a Binomial distribution with n=1000 and p=0.001. What is the mean number of bit errors?', opts:['1','1000','0.001','0.999'], ans:0},
        {q:'For a discrete random variable X with PMF p(0)=0.1, p(1)=0.6, and p(2)=0.3, what is the expected value E[X]?', opts:['1.2','1.0','1.5','0.6'], ans:0},
        {q:'The variance of a discrete random variable X is 9. What is the standard deviation?', opts:['3','9','81','1'], ans:0},
        {q:'The time to execute a process is uniformly distributed between 1 and 5 seconds. What is the expected execution time?', opts:['3','2','4','5'], ans:0},
        {q:'In a hash table, the number of collisions per insertion follows a Binomial distribution with n=10 and p=0.1. What is the variance of this distribution?', opts:['0.9','10','0.1','1'], ans:0},

    const contextLabels = {

    // ---- DOM ----
    const topicSelect = document.getElementById('topicSelect');

    const toggleBtn = document.getElementById('toggleSolutionBtn');
    const reviewContent = document.getElementById('reviewContent');
    const reviewTitle = document.getElementById('reviewTitle');
    const quizContainer = document.getElementById('quizContainer');
    const quizTitle = document.getElementById('quizTitle');

    let showSolutions = false;

    function renderReview(topicKey) {
        const data = reviewData[topicKey];
        if (!data) return;
        reviewTitle.innerHTML = `${data.title} <small>concepts</small>`;
        let html = `<p style="color:#1d3457; margin-bottom:1rem;">${data.desc}</p>`;
        data.concepts.forEach(c => {
            html += `<div class="concept-block"><strong>${c.label}</strong><p>${c.text}</p></div>`;
        });
        reviewContent.innerHTML = html;
    }

    function renderQuiz(contextKey) {
        const qs = quizMap[contextKey];
        if (!qs) return;
        const label = contextLabels[contextKey] || contextKey;
        quizTitle.textContent = `${label} · 40 questions`;
        let html = '';
        qs.forEach((q, idx) => {
            const letters = ['A','B','C','D'];
            const ansLetter = letters[q.ans];
            html += `<div class="question-item">`;
            html += `<div class="qtext"><span class="badge-context">${label}</span> ${idx+1}. ${q.q}</div>`;
            html += `<div class="options">`;
            q.opts.forEach((opt, oi) => {
                html += `<span>${letters[oi]}) ${opt}</span>`;
            });
            html += `</div>`;
            html += `<div class="solution ${showSolutions ? 'show' : ''}" id="sol-${contextKey}-${idx}">`;
            html += `<strong>📘 Detailed solution:</strong>`;
            if (q.steps && q.steps.length) {
                q.steps.forEach(step => {
                    html += `<div class="step">• ${step}</div>`;
                });
            } else {
                html += `<div class="step">• Apply the relevant rule and compute.</div>`;
            }
            html += `<div style="margin-top:0.3rem;"><strong>✅ Correct option: ${ansLetter}</strong> ( ${q.opts[q.ans]} )</div>`;
            html += `</div>`;
            html += `</div>`;
        });
        quizContainer.innerHTML = html;
    }

    function updateAll() {
        const topic = topicSelect.value;
        const context = quizSelect.value;
        renderReview(topic);
        renderQuiz(context);
    }

    toggleBtn.addEventListener('click', function() {
        showSolutions = !showSolutions;
        this.textContent = showSolutions ? '🙈 Hide detailed solutions' : '🔍 Show detailed solutions';
        this.classList.toggle('active', showSolutions);
        const context = quizSelect.value;
        renderQuiz(context);
    });

    topicSelect.addEventListener('change', updateAll);
    quizSelect.addEventListener('change', updateAll);

    updateAll();
</script>
